name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: [server, agent]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "gofmt gerekli:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      # Entegrasyon testleri burada ortam değişkeni olmadığı için atlanır; "stack" işinde gerçek DB/Redis'e karşı koşar.
      - run: go test -race -count=1 ./...
      - run: go build ./...

  web:
    name: Web (typecheck, lint, unit, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  stack:
    name: Stack (docker compose, e2e, smoke, Go integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Her koşuda RASTGELE, tek kullanımlık kimlik bilgileri: repoda parola yok, loglarda maskelenir,
      # yığın iş bitince silinir.
      - name: Generate throw-away .env
        run: |
          PG_PASS="$(openssl rand -hex 16)"
          U1_PASS="$(openssl rand -hex 16)"
          U2_PASS="$(openssl rand -hex 16)"
          JWT="$(openssl rand -hex 32)"
          for v in "$PG_PASS" "$U1_PASS" "$U2_PASS" "$JWT"; do echo "::add-mask::$v"; done
          cat > deploy/.env <<EOF
          POSTGRES_USER=ci
          POSTGRES_PASSWORD=$PG_PASS
          POSTGRES_DB=pulsecraft
          JWT_SECRET=$JWT
          DEMO_USERS=e2e@example.test:$U1_PASS:E2E Kullanici;e2e2@example.test:$U2_PASS:E2E Kullanici 2
          COOKIE_SECURE=false
          EOF
          {
            echo "E2E_EMAIL=e2e@example.test"
            echo "E2E_PASSWORD=$U1_PASS"
            echo "E2E_EMAIL2=e2e2@example.test"
            echo "E2E_PASSWORD2=$U2_PASS"
            echo "PULSECRAFT_TEST_DATABASE_URL=postgres://ci:$PG_PASS@127.0.0.1:5432/pulsecraft?sslmode=disable"
          } >> "$GITHUB_ENV"

      - name: Start stack
        working-directory: deploy
        run: docker compose up -d --build --wait --wait-timeout 300

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies and Chromium
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Playwright e2e (Vite dev server → nginx)
        working-directory: web
        env:
          E2E_DB_CONTAINER: pulsecraft-db
          E2E_DB_USER: ci
          E2E_DB_NAME: pulsecraft
          E2E_SERVER_CONTAINER: pulsecraft-server
        run: npm run e2e

      - name: Smoke test (built nginx image)
        working-directory: web
        env:
          SMOKE_BASE_URL: http://127.0.0.1:8080
        run: npm run smoke

      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Go integration tests (real PostgreSQL/TimescaleDB + Redis)
        working-directory: server
        env:
          PULSECRAFT_TEST_REDIS_URL: redis://127.0.0.1:6379/0
        # Ortam değişkeni eksikse testler sessizce ATLANIR ve iş yeşil görünürdü: atlanan varsa başarısız say.
        run: |
          set -o pipefail
          go test -race -count=1 -run Integration -v ./internal/api | tee "$RUNNER_TEMP/integration.log"
          if grep -q -- '--- SKIP' "$RUNNER_TEMP/integration.log"; then echo "Entegrasyon testleri atlandı"; exit 1; fi
          grep -q -- '--- PASS: TestIntegration_' "$RUNNER_TEMP/integration.log"

      - name: Compose logs
        if: failure()
        working-directory: deploy
        run: docker compose logs --no-color --tail=300

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: web/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        working-directory: deploy
        run: docker compose down -v
