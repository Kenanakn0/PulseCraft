version: 2

updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
    groups:
      server-go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /agent
    schedule:
      interval: weekly
    groups:
      agent-go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Base images in the Dockerfiles.
  - package-ecosystem: docker
    directories: [/server, /agent, /web]
    schedule:
      interval: weekly

  # TimescaleDB and Redis images in the compose file.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
