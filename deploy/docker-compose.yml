# =====================================================================
# PulseCraft - Altyapı + Core Server + web (nginx)
# Servisler: TimescaleDB (PostgreSQL 16) + Redis + Go server + nginx (React derlemesini sunar)
# Çalıştırma: C:\dev\pulsecraft\deploy klasöründe -> docker compose up -d --build
#
# Dışarıya (host'a) açılan tek uygulama kapısı nginx'tir (varsayılan
# http://localhost:8080). Server'ın portu host'a YAYINLANMAZ; ona yalnızca
# nginx (aynı docker ağından) erişir. db/redis geliştirme araçları için
# yalnızca loopback'te (127.0.0.1) yayınlanır, LAN'dan görünmez.
# =====================================================================

name: pulsecraft

services:

  db:
    image: timescale/timescaledb:2.30.1-pg16
    container_name: pulsecraft-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD deploy/.env içinde tanımlı olmalı}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # Veriler container silinse de kalsın diye kalıcı volume
      - db_data:/var/lib/postgresql/data
      # Şema dosyası, ilk açılışta otomatik çalışır.
      # Klasörün tamamı değil tek dosya bağlanıyor; böylece image'ın kendi
      # Timescale kurulum script'leri (000_, 001_) silinmez, bizimki onlardan sonra çalışır.
      - ./init/01_schema.sql:/docker-entrypoint-initdb.d/010_schema.sql:ro
    networks:
      - pulsecraft
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pulsecraft-redis
    restart: unless-stopped
    # appendonly: Redis kapansa da verilerini diske yazar
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - pulsecraft
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ../server
    container_name: pulsecraft-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Container içinden servislere adlarıyla (db, redis) erişilir, localhost ile değil.
      # Not: POSTGRES_PASSWORD URL'de özel karakter (@ : / ?) içeriyorsa % ile kodlanmalı.
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      PULSECRAFT_LISTEN_ADDR: ":8080"
      # Zorunlu: tanımsızsa `docker compose up` hemen hata verir (server de zaten
      # 32 karakterden kısa/boş JWT_SECRET ile başlamaz).
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET deploy/.env içinde tanımlı olmalı (en az 32 karakter)}"
      DEMO_USERS: "${DEMO_USERS:?DEMO_USERS deploy/.env içinde tanımlı olmalı (en az bir kullanıcı)}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      # X-Forwarded-For YALNIZCA nginx'in sabit adresinden gelen isteklerde okunur
      # (aşağıdaki ağ tanımıyla eşleşmeli). Geniş bir Docker aralığı yazma: ağ
      # geçidini (host) de kapsayabilir.
      TRUSTED_PROXIES: "172.30.10.10"
    # Host'a yayınlanmaz; yalnızca aynı ağdaki nginx erişir (expose sadece belgeleme amaçlıdır).
    expose:
      - "8080"
    networks:
      - pulsecraft
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    # React derlemesi + nginx yapılandırması tek imajda (web/Dockerfile). Context REPO KÖKÜ.
    build:
      context: ..
      dockerfile: web/Dockerfile
    container_name: pulsecraft-nginx
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      # Varsayılan olarak yalnızca bu makineden erişilir. LAN'a açmak için
      # "127.0.0.1:" önekini kaldır (ve önce bir güvenlik değerlendirmesi yap).
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    networks:
      pulsecraft:
        ipv4_address: 172.30.10.10
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------
  # ÖRNEK AGENT (isteğe bağlı): yalnızca `--profile demo` ile başlar.
  #   1) Arayüzde "Sunucu ekle" ile bir sunucu oluşturun, anahtarı "Kopyala" ile alın.
  #   2) Anahtarı komuta yazmadan dosyaya kaydedin (deploy klasöründe):
  #        Get-Clipboard | Set-Content -NoNewline secrets\demo-agent.key
  #      (deploy/secrets/ içeriği .gitignore'da; bkz. deploy/secrets/README.md.)
  #   3) docker compose --profile demo up -d --build demo-agent
  # Anahtar DOSYA olarak okunur; ortam değişkenine ya da komut satırına girmez (docker inspect'te görünmez).
  # Tek dosya DEĞİL, var olan deploy/secrets KLASÖRÜ salt okunur bağlanır: Docker Desktop, bağlanacak dosya
  # yoksa host'ta onun yerine sessizce boş bir klasör oluşturuyor (compose `secrets:` da, `create_host_path:
  # false` da bunu önlemedi — prova yığınında denendi). Dosya yoksa agent açık bir hatayla durur.
  # ---------------------------------------------------------------------
  demo-agent:
    profiles: ["demo"]
    build:
      context: ../agent
    container_name: pulsecraft-demo-agent
    # 401 (yanlış/silinmiş anahtar → çıkış 3) ya da yapılandırma hatasında (çıkış 2) sonsuz yeniden başlatma
    # döngüsüne girmesin: birkaç denemeden sonra durur; nedeni `docker compose logs demo-agent`'ta yazar.
    restart: on-failure:3
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./secrets:/run/secrets:ro
    command:
      - "-server=http://server:8080"
      - "-api-key-file=/run/secrets/demo-agent.key"
      # Uydurma bir ad: agent gerçek bilgisayar/container adını ASLA kendiliğinden göndermez.
      - "-hostname=${DEMO_AGENT_HOSTNAME:-demo-agent-01}"
      - "-interval=${DEMO_AGENT_INTERVAL:-3s}"
    networks:
      - pulsecraft

networks:
  pulsecraft:
    ipam:
      config:
        # Sabit subnet: nginx'in adresi (172.30.10.10) TRUSTED_PROXIES ile eşleşmek zorunda.
        - subnet: 172.30.10.0/24
          gateway: 172.30.10.1

volumes:
  db_data:
  redis_data:
