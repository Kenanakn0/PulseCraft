# PulseCraft: TimescaleDB + Redis + Go server + nginx (serves the React build).
# Run from this folder: docker compose up -d --build
#
# nginx is the only application entry point on the host (default http://localhost:8080). The server's port
# is not published; only nginx reaches it over the Docker network. db and redis are published on loopback
# (127.0.0.1) for development tools and are not visible on the LAN.

name: pulsecraft

services:

  db:
    image: timescale/timescaledb:2.30.1-pg16
    container_name: pulsecraft-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD deploy/.env içinde tanımlı olmalı}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Runs on the first start of an empty volume. A single file is mounted (not the folder) so the image's
      # own TimescaleDB setup scripts (000_, 001_) stay in place and run first.
      - ./init/01_schema.sql:/docker-entrypoint-initdb.d/010_schema.sql:ro
    networks:
      - pulsecraft
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pulsecraft-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - pulsecraft
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ../server
    container_name: pulsecraft-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # A POSTGRES_PASSWORD containing @ : / ? would have to be percent-encoded in this URL.
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      PULSECRAFT_LISTEN_ADDR: ":8080"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET deploy/.env içinde tanımlı olmalı (en az 32 karakter)}"
      DEMO_USERS: "${DEMO_USERS:?DEMO_USERS deploy/.env içinde tanımlı olmalı (en az bir kullanıcı)}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      # X-Forwarded-For is only read from nginx's fixed address (must match the network below). Do not use a
      # wide Docker range: it could include the gateway, i.e. the host.
      TRUSTED_PROXIES: "172.30.10.10"
    expose:
      - "8080"
    networks:
      - pulsecraft
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    # The React build and the nginx config live in one image; the build context is the repository root.
    build:
      context: ..
      dockerfile: web/Dockerfile
    container_name: pulsecraft-nginx
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      # Reachable from this machine only. Removing the "127.0.0.1:" prefix exposes it to the LAN; put an
      # HTTPS proxy in front first (see SECURITY.md).
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    networks:
      pulsecraft:
        ipv4_address: 172.30.10.10
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Example agent (optional), started only with `--profile demo`:
  #   1) In the UI, "Sunucu ekle" creates a server; copy its key with "Kopyala".
  #   2) Save the key to a file without typing it into a command (in this folder):
  #        Get-Clipboard | Set-Content -NoNewline secrets\demo-agent.key
  #   3) docker compose --profile demo up -d --build demo-agent
  # The key is read from a file, so it never appears in the environment, the command line or docker inspect.
  # The existing deploy/secrets FOLDER is mounted rather than a single file: when a bind-mounted file does not
  # exist, Docker Desktop silently creates an empty directory in its place (neither compose `secrets:` nor
  # `create_host_path: false` prevented that). Without the file the agent stops with a clear error.
  demo-agent:
    profiles: ["demo"]
    build:
      context: ../agent
    container_name: pulsecraft-demo-agent
    # A rejected key (exit 3) or a configuration error (exit 2) must not cause an endless restart loop; the
    # reason is in `docker compose logs demo-agent`.
    restart: on-failure:3
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./secrets:/run/secrets:ro
    command:
      - "-server=http://server:8080"
      - "-api-key-file=/run/secrets/demo-agent.key"
      # A made-up name: the agent never sends the real machine or container name on its own.
      - "-hostname=${DEMO_AGENT_HOSTNAME:-demo-agent-01}"
      - "-interval=${DEMO_AGENT_INTERVAL:-3s}"
    networks:
      - pulsecraft

networks:
  pulsecraft:
    ipam:
      config:
        # Fixed subnet: nginx's address (172.30.10.10) must match TRUSTED_PROXIES.
        - subnet: 172.30.10.0/24
          gateway: 172.30.10.1

volumes:
  db_data:
  redis_data:
