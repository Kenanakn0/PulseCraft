# =====================================================================
# PulseCraft - Altyapı + Core Server
# Servisler: TimescaleDB (PostgreSQL 16) + Redis + Go server
# Çalıştırma: C:\dev\pulsecraft\deploy klasöründe -> docker compose up -d
# =====================================================================

name: pulsecraft

services:

  db:
    image: timescale/timescaledb:latest-pg16
    container_name: pulsecraft-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Veriler container silinse de kalsın diye kalıcı volume
      - db_data:/var/lib/postgresql/data
      # Şema dosyası, ilk açılışta otomatik çalışır.
      # Klasörün tamamı değil tek dosya bağlanıyor; böylece image'ın kendi
      # Timescale kurulum script'leri (000_, 001_) silinmez, bizimki onlardan sonra çalışır.
      - ./init/01_schema.sql:/docker-entrypoint-initdb.d/010_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pulsecraft-redis
    restart: unless-stopped
    # appendonly: Redis kapansa da verilerini diske yazar
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ../server
    container_name: pulsecraft-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Container içinden servislere adlarıyla (db, redis) erişilir, localhost ile değil.
      # Not: POSTGRES_PASSWORD URL'de özel karakter (@ : / ?) içeriyorsa % ile kodlanmalı.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      PULSECRAFT_LISTEN_ADDR: ":8080"
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db_data:
  redis_data:
