# PulseCraft nginx: serves the React build and reverse-proxies /api and /ws.
# Copied into the image by web/Dockerfile (after a change: docker compose up -d --build nginx).

# Send "Connection: upgrade" only when the client asked for an upgrade; plain requests get "close".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    server_tokens off;
    client_max_body_size 2m;    # an agent batch of 1000 samples is about 250 KB

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # CSP: scripts, styles and connections from this origin only, so even an XSS cannot load a script or
    # send data elsewhere. The Vite build has no inline scripts or styles (React's style prop uses CSSOM and
    # is unaffected). In modern browsers connect-src 'self' also covers ws:/wss: on the same host.
    # Note: a location with its own add_header drops all of these, which is why the locations below use
    # `expires` instead.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # A variable in proxy_pass makes nginx resolve "server" through Docker's DNS per request (cached 10 s),
    # so a recreated server container with a new IP does not cause 502s, and nginx starts even while the
    # server is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream http://server:8080;

    location /api/ {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Keep Host including the port: the WebSocket Origin check compares it with the Origin host.
        # $host would drop the port (localhost:8080 -> localhost) and fail the check.
        proxy_set_header Host $http_host;

        # nginx is the only edge proxy: OVERWRITE a client-supplied X-Forwarded-For instead of appending to
        # it. The server trusts this header only from nginx's fixed address (TRUSTED_PROXIES).
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /ws {
        proxy_pass $upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;

        # Long-lived connection: the default 60 s read timeout would cut the live stream. The server closes
        # the connection itself when the session ends (code 4401).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Vite puts a content hash into asset file names, so they can be cached for a year. A missing asset
    # returns 404 instead of index.html (HTML served as a .js file would fail with a confusing error).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # index.html is never cached, so a new release's asset names are picked up immediately.
    location = /index.html {
        expires -1;
    }

    # SPA: unknown paths (client-side routes such as /nodes/abc) fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
