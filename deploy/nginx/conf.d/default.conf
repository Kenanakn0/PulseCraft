# PulseCraft - nginx: React derlemesini (statik dosyalar) sunar + /api ve /ws için reverse proxy.
# Bu dosya web/Dockerfile ile imaja KOPYALANIR (değişince `docker compose up -d --build nginx`).

# WebSocket yükseltmesi: istemci Upgrade gönderdiyse "upgrade", göndermediyse
# "close" (normal isteklerde bağlantıyı sonsuza dek açık tutma).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    server_tokens off;          # Server başlığında nginx sürümünü gösterme
    client_max_body_size 2m;    # agent'ın toplu gönderimi (1000 örnek ~250 KB) sığar

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # İçerik güvenlik politikası (CSP): tarayıcı YALNIZCA aynı origin'den gelen betik/stil/bağlantıya
    # izin verir. XSS olsa bile saldırganın betiği yüklemesi/veriyi dışarı sızdırması engellenir.
    #  - script-src 'self': satır içi betik YOK (Vite derlemesi tek dosya betik üretir).
    #  - style-src 'self': satır içi <style>/style="" YOK; React'in style özelliği (CSSOM) etkilenmez.
    #  - connect-src 'self': fetch ve WebSocket yalnızca aynı origin'e (/api, /ws). Modern tarayıcılarda
    #    'self' aynı host'un ws:/wss: adresini de kapsar.
    #  - frame-ancestors 'none': X-Frame-Options'ın modern karşılığı (tıklama gaspı koruması).
    # NOT: add_header, bir location kendi add_header'ını tanımlarsa üst düzeydekileri SİLER; bu yüzden
    # aşağıdaki location'larda add_header yerine `expires` kullanılıyor.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker'ın gömülü DNS'i + değişken içeren proxy_pass: upstream adı (server)
    # her istekte (10 sn önbellekle) çözülür. Böylece server container'ı yeniden
    # oluşturulup IP'si değişse bile nginx eski adrese takılıp 502 vermez ve
    # server kapalıyken nginx başlangıçta çökmez.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream http://server:8080;

    location /api/ {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Host ORİJİNAL haliyle (port dahil) korunur: WebSocket Origin kontrolü,
        # tarayıcının Origin host'unun isteğin Host'uyla aynı olmasına dayanır.
        # $host portu atardı (localhost:8080 -> localhost) ve kontrol reddederdi;
        # bu yüzden $http_host.
        proxy_set_header Host $http_host;

        # nginx bu ağdaki tek uç proxy'dir: istemcinin gönderdiği X-Forwarded-For
        # UYDURMA olabilir, o yüzden eklemek yerine ÜZERİNE YAZIYORUZ. Server
        # bu başlığı yalnızca nginx'in sabit adresinden (TRUSTED_PROXIES) okur.
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /ws {
        proxy_pass $upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;

        # Uzun ömürlü bağlantı: varsayılan 60 sn okuma zaman aşımı canlı
        # yayını keserdi. Oturum sonunu sunucu kendisi kapatır (close code 4401).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Vite, dosya adlarına içerik özeti koyar (index-BXnXXFFB.js): içerik değişince ad da değişir,
    # bu yüzden 1 yıl önbelleğe alınabilir. Olmayan dosya için index.html DEĞİL 404 dön
    # (aksi halde eksik bir .js isteği "geçerli" HTML alıp tarayıcıda anlaşılmaz hata verirdi).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # index.html hiç önbelleğe alınmaz: yeni sürüm yayınlanınca tarayıcı yeni dosya adlarını hemen görsün.
    location = /index.html {
        expires -1;
    }

    # SPA: bilinmeyen yollar (/nodes/abc gibi React router yolları) index.html'e düşer.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
