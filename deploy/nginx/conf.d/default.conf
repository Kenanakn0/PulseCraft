# PulseCraft - nginx: statik dosyalar + /api ve /ws için reverse proxy.
# Şimdilik placeholder index.html sunar; 4.1'de React build'i html/ klasörünün yerini alacak.

# WebSocket yükseltmesi: istemci Upgrade gönderdiyse "upgrade", göndermediyse
# "close" (normal isteklerde bağlantıyı sonsuza dek açık tutma).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    server_tokens off;          # Server başlığında nginx sürümünü gösterme
    client_max_body_size 2m;    # agent'ın toplu gönderimi (1000 örnek ~250 KB) sığar

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Docker'ın gömülü DNS'i + değişken içeren proxy_pass: upstream adı (server)
    # her istekte (10 sn önbellekle) çözülür. Böylece server container'ı yeniden
    # oluşturulup IP'si değişse bile nginx eski adrese takılıp 502 vermez ve
    # server kapalıyken nginx başlangıçta çökmez.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream http://server:8080;

    location /api/ {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Host ORİJİNAL haliyle (port dahil) korunur: WebSocket Origin kontrolü,
        # tarayıcının Origin host'unun isteğin Host'uyla aynı olmasına dayanır.
        # $host portu atardı (localhost:8080 -> localhost) ve kontrol reddederdi;
        # bu yüzden $http_host.
        proxy_set_header Host $http_host;

        # nginx bu ağdaki tek uç proxy'dir: istemcinin gönderdiği X-Forwarded-For
        # UYDURMA olabilir, o yüzden eklemek yerine ÜZERİNE YAZIYORUZ. Server
        # bu başlığı yalnızca nginx'in sabit adresinden (TRUSTED_PROXIES) okur.
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /ws {
        proxy_pass $upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;

        # Uzun ömürlü bağlantı: varsayılan 60 sn okuma zaman aşımı canlı
        # yayını keserdi. Oturum sonunu sunucu kendisi kapatır (close code 4401).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # SPA: bilinmeyen yollar index.html'e düşer (4.1'de React router için).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
